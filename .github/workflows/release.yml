name: Build and release webOS apps

on:
  push:
    branches:
      - 3.0
      - 4.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6

      - name: Build 4.0 IPK
        if: github.ref_name == '4.0'
        run: |
          npm install
          npm run pack-p
          mkdir -p builds
          ares-package dist -o builds
          release_version=$(printf '%02d' "$GITHUB_RUN_NUMBER")
          package=$(find builds -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$package"
          mv "$package" "builds/${release_version}-4.ipk"

      - name: Build 3.0 IPK
        if: github.ref_name == '3.0'
        run: |
          mkdir -p package builds
          rsync -a --exclude '.git' --exclude '.github' --exclude 'builds' --exclude 'package' ./ package/
          ares-package package -o builds
          release_version=$(printf '%02d' "$GITHUB_RUN_NUMBER")
          package_file=$(find builds -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$package_file"
          mv "$package_file" "builds/${release_version}-3.ipk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(printf '%02d' "$GITHUB_RUN_NUMBER")
          if [ "${GITHUB_REF_NAME}" = "4.0" ]; then
            artifact="builds/${release_version}-4.ipk"
            tag="4.0-${release_version}"
            title="4.0 release ${release_version}"
            release_flags=""
          else
            artifact="builds/${release_version}-3.ipk"
            tag="3.0-nightly-${release_version}"
            title="3.0 nightly ${release_version}"
            release_flags="--prerelease"
          fi
          gh release create "$tag" "$artifact" \
            --title "$title" \
            --generate-notes $release_flags
