name: Build and release webOS apps

on:
  push:
    branches:
      - 3.0
      - 4.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.ref_name == '4.0'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build 4.0 bundle
        if: github.ref_name == '4.0'
        run: |
          npm install
          npm run pack-p
          cd dist
          zip -r "../OpenNOW-webOS-4.0-${GITHUB_SHA::7}.zip" .

      - name: Build 3.0 source package
        if: github.ref_name == '3.0'
        run: |
          mkdir -p builds
          zip -r "builds/OpenNOW-webOS-3.0-${GITHUB_SHA::7}.zip" . \
            -x '.git/*' '.github/*' 'builds/*' 'node_modules/*' 'dist/*'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "4.0" ]; then
            artifact="OpenNOW-webOS-4.0-${GITHUB_SHA::7}.zip"
            tag="4.0-build-${GITHUB_RUN_NUMBER}"
          else
            artifact="builds/OpenNOW-webOS-3.0-${GITHUB_SHA::7}.zip"
            tag="3.0-build-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" "$artifact" \
            --title "$GITHUB_REF_NAME build $GITHUB_RUN_NUMBER" \
            --generate-notes
